name: Bot News IA Runner

on:
  schedule:
    # Exécution automatique toutes les 30 minutes
    - cron: '*/30 * * * *'
  workflow_dispatch: # Permet de lancer le bot manuellement via un bouton sur GitHub

jobs:
  run-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Permet de sauvegarder la base SQLite mise à jour

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Exécuter le cycle de veille
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: |
          python main.py --run-once

      - name: Sauvegarder la base de données (anti-doublons)
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/news_bot.db
          git diff --staged --quiet || (git commit -m "chore: synchronisation base de donnees [skip ci]" && git push)
